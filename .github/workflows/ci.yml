name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GHCR_PAT: ${{ secrets.GHCR_PAT }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev,all]"
      - name: Run tests
        run: python -m pytest -q

  build-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (verifies Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: sentinel:ci-${{ github.sha }}
      - name: Login to GHCR
        if: github.ref == 'refs/heads/main' && env.GHCR_PAT != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ env.GHCR_PAT }}
      - name: Push to GHCR on main (when PAT configured)
        if: github.ref == 'refs/heads/main' && env.GHCR_PAT != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/hyp-nju-edu/agent:latest, ghcr.io/hyp-nju-edu/agent:${{ github.sha }}
          platforms: linux/amd64
